<!doctype html>
<!-- SvelteKit app shell for Inkwell.
     The %sveltekit.*% placeholders are replaced at build time with
     the rendered head and body from the active route. -->
<html lang="en-gb" style="color-scheme: light dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="text-scale" content="scale" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <!-- Opts the page into scroll-triggered reveals before first paint, so
         revealed content is never briefly visible and then hidden. Content is
         visible by default: without this class (no JS, no IntersectionObserver,
         or reduced motion) every .reveal simply renders in place. -->
    <script>
      if (
        "IntersectionObserver" in window &&
        !matchMedia("(prefers-reduced-motion: reduce)").matches
      )
        document.documentElement.classList.add("js-motion");
    </script>
    %sveltekit.head%
  </head>
  <!-- Hover-based preloading: prefetches data when the cursor rests on a
       link, and prefetches code chunks as soon as a route enters the viewport. -->
  <body
    data-sveltekit-preload-data="hover"
    data-sveltekit-preload-code="viewport"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
