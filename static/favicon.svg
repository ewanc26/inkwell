<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Inkwell favicon: serif I letterform + ink drop, adapted from wordmark.svg.
       Uses currentColor for the letterform (adapts to light/dark theme)
       and var(--color-accent) for the ink drop (brand green). -->

  <!-- Top bar -->
  <rect x="108" y="64" width="296" height="44" rx="16" fill="currentColor" />

  <!-- Vertical stroke -->
  <rect x="189" y="108" width="134" height="290" fill="currentColor" />

  <!-- Bottom bar -->
  <rect x="108" y="398" width="296" height="44" rx="16" fill="currentColor" />

  <!-- Ink drop: brand green, auto-adapts light/dark via CSS custom property -->
  <circle cx="256" cy="468" r="20" fill="var(--color-accent, #139500)" />
</svg>
