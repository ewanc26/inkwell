# Inkwell Android Gradle properties.
#
# org.gradle.jvmargs: 2 GB heap for the daemon — sufficient for a Compose +
# Hilt project without KSP compilation becoming a bottleneck.
# org.gradle.java.home is deliberately NOT set here: it used to hardcode
#   Android Studio's embedded JDK path, which only exists on the original
#   author's Mac and broke both CI and any other contributor's build. If
#   your system JAVA_HOME isn't JDK 17+, set org.gradle.java.home in your
#   own ~/.gradle/gradle.properties instead of this project-shared file.
# android.useAndroidX: required for Jetpack Compose and Material 3.
# kotlin.code.style: official means no extra trailing commas, matching
#   the Android Studio default formatter.
# android.nonTransitiveRClass: smaller APKs by making R classes
#   non-transitive (Gradle 8+ default behaviour).
# android.enableResourceOptimizations: off. AGP's default release-build
#   resource path shortening flattens res/mipmap-hdpi/ic_launcher.png
#   into an obfuscated flat name like res/o-.png, which breaks tools
#   that expect standard res/<density-qualified-folder>/name.png paths
#   (e.g. fdroidserver's icon extraction for the self-hosted F-Droid
#   repo). Code shrinking/obfuscation via isMinifyEnabled is unaffected.

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableResourceOptimizations=false
