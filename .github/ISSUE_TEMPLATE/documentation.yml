name: Documentation
description: Report missing or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs improving?
      description: File, page, or section that needs work.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current state
  - type: textarea
    id: suggested
    attributes:
      label: Suggested change
