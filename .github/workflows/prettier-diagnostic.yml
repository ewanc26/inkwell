name: Prettier diagnostic

on:
  pull_request:

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile
      - name: Print canonical formatter diff
        working-directory: website
        run: |
          pnpm exec prettier --write src/routes/+page.server.ts src/routes/features/+page.server.ts
          git diff -- src/routes/+page.server.ts src/routes/features/+page.server.ts
          exit 1
