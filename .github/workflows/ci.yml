name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which part of the monorepo actually changed so an
  # iOS-only or Android-only commit doesn't pay for the other
  # platform's (much slower) build.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'iOS/**'
              - 'shared/**'
            android:
              - 'Android/**'
              - 'shared/**'
            website:
              - 'website/**'

  ios:
    name: iOS build + test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select an Xcode version that supports Icon Composer (.icon) assets
        run: |
          # Inkwell/Inkwell.icon is the Xcode 26 Icon Composer format. Older
          # Xcodes (e.g. the runner's default 16.4) don't recognize it as an
          # asset-catalog input at all and silently compile Assets.xcassets
          # alone, which has no icon set named "Inkwell" — a hard build
          # error, not a warning. This is independent of the app's iOS 18.0
          # deployment target; it's purely an Xcode-version requirement.
          best=""
          for app in /Applications/Xcode*.app; do
            version=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | awk '/^Xcode/ {print $2}')
            major=${version%%.*}
            if [ -n "$major" ] && [ "$major" -ge 26 ] 2>/dev/null; then
              best="$app"
            fi
          done
          if [ -z "$best" ]; then
            echo "No installed Xcode >= 26 found (needed for Inkwell.icon). Available:" >&2
            ls /Applications | grep -i xcode >&2
            exit 1
          fi
          echo "Selecting $best"
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - name: Resolve an available iOS Simulator destination
        id: destination
        working-directory: iOS
        run: |
          # The runner's newest installed Simulator runtime may lag behind
          # the test target's deployment target (both track whatever Xcode
          # version the original author has locally) — pick the
          # highest-versioned iPhone runtime available, then separately
          # decide whether it's new enough to actually run tests on.
          best=$(xcrun simctl list devices available iOS -j | jq -r '
            [.devices | to_entries[] | . as $e | $e.value[] | select(.name | startswith("iPhone")) |
              {name: .name, runtimeId: $e.key}] |
            sort_by(.runtimeId) | last
          ')
          name=$(echo "$best" | jq -r '.name')
          runtime_id=$(echo "$best" | jq -r '.runtimeId')
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "No iOS Simulator device found" >&2
            exit 1
          fi
          runtime_version=$(echo "$runtime_id" | grep -oE '[0-9]+-[0-9]+(-[0-9]+)?$' | tr '-' '.')
          test_min=$(xcodebuild -showBuildSettings -project Inkwell.xcodeproj -target InkwellTests 2>/dev/null \
            | awk -F'= ' '/^ *IPHONEOS_DEPLOYMENT_TARGET =/ {print $2; exit}')
          echo "Newest available runtime: $runtime_version ($name); InkwellTests requires >= $test_min"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ -n "$test_min" ] && printf '%s\n%s\n' "$test_min" "$runtime_version" | sort -V | tail -1 | grep -qx "$test_min" && [ "$test_min" != "$runtime_version" ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
          else
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and test, if a compatible Simulator runtime is available)
        working-directory: iOS
        run: |
          action=build
          if [ "${{ steps.destination.outputs.runnable }}" = "true" ]; then
            action="build test"
          else
            echo "::warning::No installed Simulator runtime satisfies InkwellTests' deployment target — building only, not running tests."
          fi
          xcodebuild \
            -project Inkwell.xcodeproj \
            -scheme Inkwell \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.name }}" \
            -skip-testing:InkwellUITests \
            $action

  android:
    name: Android build + lint + test
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, and test
        working-directory: Android
        run: ./gradlew clean assembleDebug lint test

  website:
    name: Website check + build
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: website
        run: pnpm check

      - name: Format check
        working-directory: website
        run: pnpm exec prettier --check --ignore-unknown .

      - name: Build
        working-directory: website
        run: pnpm build
