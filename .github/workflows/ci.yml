name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap and correctness-critical (catches the in-app Legal screens
  # drifting from the website copy, or either drifting from the
  # legal/*.md source), so it runs unconditionally rather than being
  # gated by the path filter below.
  legal-sync:
    name: Legal docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tools/legal/render.mjs --check

  # Cheap and correctness-critical for the same reason as legal-sync: catches
  # a checked-in Standard.site schema/fixture drifting from its pinned CID or
  # digest (see tools/lexicons/update-standard-site.mjs). Offline and
  # deterministic, so it runs unconditionally rather than being gated by the
  # path filter below -- it never touches the network and never auto-updates
  # the pins, it only fails when the working tree no longer matches them.
  standard-site-lexicons:
    name: Standard.site Lexicon conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node tools/lexicons/update-standard-site.mjs --check

  # Detect which part of the monorepo actually changed so an
  # iOS-only or Android-only commit doesn't pay for the other
  # platform's (much slower) build.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            ios:
              - 'iOS/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            android:
              - 'Android/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            website:
              - 'website/**'
              - '.github/workflows/ci.yml'

  ios:
    name: iOS build + test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true

      - name: Select an Xcode version that supports Icon Composer (.icon) assets
        timeout-minutes: 2
        run: |
          # Inkwell/Inkwell.icon is the Xcode 26 Icon Composer format. Older
          # Xcodes (e.g. the runner's default 16.4) don't recognize it as an
          # asset-catalog input at all and silently compile Assets.xcassets
          # alone, which has no icon set named "Inkwell" — a hard build
          # error, not a warning. This is independent of the app's iOS 18.0
          # deployment target; it's purely an Xcode-version requirement.
          best=""
          for app in /Applications/Xcode*.app; do
            version=$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | awk '/^Xcode/ {print $2}')
            major=${version%%.*}
            if [ -n "$major" ] && [ "$major" -ge 26 ] 2>/dev/null; then
              best="$app"
            fi
          done
          if [ -z "$best" ]; then
            echo "No installed Xcode >= 26 found (needed for Inkwell.icon). Available:" >&2
            ls /Applications | grep -i xcode >&2
            exit 1
          fi
          echo "Selecting $best"
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - name: Resolve an available iOS Simulator destination
        id: destination
        timeout-minutes: 3
        working-directory: iOS
        run: |
          # The runner's newest installed Simulator runtime may lag behind
          # the test target's deployment target (both track whatever Xcode
          # version the original author has locally) — pick the
          # highest-versioned iPhone runtime available, then separately
          # decide whether it's new enough to actually run tests on.
          best=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | . as $e | select($e.key | contains(".iOS-")) | $e.value[] |
              select(.name | startswith("iPhone")) |
              {name: .name, runtimeId: $e.key}] |
            sort_by(.runtimeId) | last
          ')
          name=$(echo "$best" | jq -r '.name')
          runtime_id=$(echo "$best" | jq -r '.runtimeId')
          if [ -z "$name" ] || [ "$name" = "null" ]; then
            echo "No iOS Simulator device found" >&2
            exit 1
          fi
          runtime_version=$(echo "$runtime_id" | grep -oE '[0-9]+-[0-9]+(-[0-9]+)?$' | tr '-' '.')
          test_min=$(xcodebuild -showBuildSettings -project Inkwell.xcodeproj -target InkwellTests 2>/dev/null \
            | awk -F'= ' '/^ *IPHONEOS_DEPLOYMENT_TARGET =/ {print $2; exit}')
          echo "Newest available runtime: $runtime_version ($name); InkwellTests requires >= $test_min"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if [ -n "$test_min" ] && printf '%s\n%s\n' "$test_min" "$runtime_version" | sort -V | tail -1 | grep -qx "$test_min" && [ "$test_min" != "$runtime_version" ]; then
            echo "runnable=false" >> "$GITHUB_OUTPUT"
          else
            echo "runnable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and test, if a compatible Simulator runtime is available)
        timeout-minutes: 20
        working-directory: iOS
        run: |
          extra_args=()
          action=build
          if [ "${{ steps.destination.outputs.runnable }}" = "true" ]; then
            # Name both test bundles explicitly rather than relying on the
            # scheme's default test-action membership — InkwellUITests now
            # carries real accessibility coverage (see InkwellUITests/) and
            # must actually run in CI, not silently ride along with (or
            # drop out of) whatever an autocreated scheme happens to include.
            action="build test"
            extra_args=(-only-testing:InkwellTests -only-testing:InkwellUITests)
          else
            echo "::warning::No installed Simulator runtime satisfies InkwellTests' deployment target — building only, not running tests."
          fi
          xcodebuild \
            -project Inkwell.xcodeproj \
            -scheme Inkwell \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.name }}" \
            -parallel-testing-enabled NO \
            "${extra_args[@]}" \
            $action

  android:
    name: Android build + lint + test
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Build, lint, and test
        timeout-minutes: 15
        working-directory: Android
        run: ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace clean assembleDebug assembleRelease lint test :shared:jvmTest

      - name: Assert release permission allowlist
        working-directory: Android
        run: bash tools/check-release-permissions.sh

  # Instrumentation tests need a booted emulator, which is an order of
  # magnitude slower than the JVM job above -- hence a separate job behind the
  # same Android path filter, so a docs-only or website-only change never pays
  # for it. Everything it asserts (singleTask intent delivery, process
  # recreation, on-device accessibility semantics) is unreachable from
  # Robolectric, so it is not duplicating the `test` task.
  android-instrumentation:
    name: Android instrumentation smoke suite
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          # Without KVM the emulator falls back to software emulation and a
          # smoke suite that takes ~2 minutes takes ~30.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The AVD is deterministic for a given API level, so it is worth caching
      # the ~1GB image and a warm boot snapshot rather than recreating both on
      # every run.
      - name: Cache the AVD and its boot snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-34-aosp-atd

      - name: Create the AVD and snapshot a cold boot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created and snapshotted."

      - name: Run the instrumentation suite
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: Android
          # A crashed or wedged emulator must surface as a failed step rather
          # than a job that burns its whole timeout, so logcat is captured in
          # the background and the Gradle task carries its own timeout.
          script: |
            adb logcat -c || true
            adb logcat > "${{ github.workspace }}/logcat.txt" 2>&1 &
            ./gradlew --no-daemon --max-workers=2 --console=plain --stacktrace \
              :app:connectedDebugAndroidTest

      - name: Upload instrumentation reports and logcat
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-instrumentation-results
          path: |
            Android/app/build/reports/androidTests/connected/**
            Android/app/build/outputs/androidTest-results/**
            logcat.txt
          if-no-files-found: warn
          retention-days: 7

  website:
    name: Website check + build
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: website
        run: pnpm check

      - name: Format check
        working-directory: website
        run: pnpm exec prettier --check --ignore-unknown .

      - name: Check the served AltStore manifest matches the working copy
        run: diff iOS/altstore/source.json website/static/altstore/source.json

      - name: Validate current AltStore IPA metadata
        run: node tools/release/validate-altstore.mjs --hosted

      - name: Check the served F-Droid repo matches the release repo
        run: diff -r Android/fdroid-repo/repo website/static/fdroid/repo

      - name: Build
        working-directory: website
        run: pnpm build

      - name: Accessibility audit (pa11y-ci against the built site)
        working-directory: website
        run: |
          pnpm preview --port 4173 --strictPort &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4173/ -o /dev/null && break
            sleep 1
          done
          pnpm exec pa11y-ci --config .pa11yci.json
