name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Detect which part of the monorepo actually changed so an
  # iOS-only or Android-only commit doesn't pay for the other
  # platform's (much slower) build.
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ios:
              - 'iOS/**'
              - 'shared/**'
            android:
              - 'Android/**'
              - 'shared/**'
            website:
              - 'website/**'

  ios:
    name: iOS build + test
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve an available iOS Simulator destination
        id: destination
        run: |
          device=$(xcrun simctl list devices available iOS -j | jq -r '
            [.devices[][] | select(.name | startswith("iPhone"))][0].name
          ')
          if [ -z "$device" ] || [ "$device" = "null" ]; then
            echo "No iOS Simulator device found" >&2
            exit 1
          fi
          echo "name=$device" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: iOS
        run: |
          xcodebuild \
            -project Inkwell.xcodeproj \
            -scheme Inkwell \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.name }}" \
            build test

  android:
    name: Android build + lint + test
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, and test
        working-directory: Android
        run: ./gradlew clean assembleDebug lint test

  website:
    name: Website check + build
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: website
        run: pnpm check

      - name: Format check
        working-directory: website
        run: pnpm exec prettier --check --ignore-unknown .

      - name: Build
        working-directory: website
        run: pnpm build
